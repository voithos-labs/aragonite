name: Bug
description: Something in the editor is broken
type: Bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The markdown you started with and the keys you pressed. The smaller the better.
      placeholder: |
        - one
          - two

        Caret at the end of "two", press Backspace twice: the text is gone but the bullet stays.
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Version, browser, mode
      description: Optional, but good lord please include it - saves me a few roundtrips lol
      placeholder: 0.11.1, Firefox 158 on Windows 11, live mode

  - type: textarea
    id: recording
    attributes:
      label: Recording
      description: Optional. The demo's "report a bug" button puts a recording of what you typed on your clipboard to paste here (the document's text included), so we can replay it. One too long for an issue downloads as a .json file instead, so drag that in here.
