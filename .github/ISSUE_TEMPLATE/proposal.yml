name: Proposal
description: Something aragonite should be able to do and can't yet
body:
  - type: textarea
    id: what-you-want
    attributes:
      label: What you want
      description: The capability, described from the outside.
    validations:
      required: true

  - type: textarea
    id: why-not-today
    attributes:
      label: Why the current surface cannot do it
      description: What you tried and where it ran out. A workaround that almost works is useful evidence.
    validations:
      required: true

  - type: textarea
    id: expected-shape
    attributes:
      label: Shape you would expect
      description: Optional. A prop, a method, a directive, a sketch of the call site.

  - type: markdown
    attributes:
      value: After 1.0, API proposals meet the plugin-contract freeze rules, so additive shapes land far more easily than ones that move existing surface.
