name: Deploy
# Manual until the first deploy is verified against the live domain; add a
# `push: branches: [main]` trigger once it is.
on:
  workflow_dispatch:

permissions:
  contents: read

# One live site, so deploys serialize; cancelling one half-published is worse
# than queueing it.
concurrency:
  group: deploy
  cancel-in-progress: false

# Actions pinned to commit SHAs (a major tag is mutable); bump SHA and comment together.
# wrangler is a pinned devDependency instead of a third-party action, so the deploy tool
# rides the same lockfile and dependabot lane as everything else.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Assets-only: wrangler uploads ./build per wrangler.toml and binds no script.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
