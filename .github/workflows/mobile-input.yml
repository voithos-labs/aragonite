name: Mobile input
# The editor under real phone input: an Android emulator (Chrome, Gboard) and the iOS Simulator
# (Mobile Safari, driven by Appium), typing and touching through the platform's own keyboard and
# touch screen. Each job runs the rows in `scripts/mobile/` and uploads its recordings.
on:
  push:
    branches: [fix/touch-selection]
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to run
        type: choice
        options: [both, android, ios]
        default: both

permissions:
  contents: read

# Actions pinned to commit SHAs (a major tag is mutable); bump SHA and comment together.
jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/mobile/serve.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          enable-hw-keyboard: false
          script: bash scripts/mobile/android.sh mobile-out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-run-${{ matrix.run }}
          path: |
            mobile-out/
            preview.log

  ios:
    if: inputs.platform != 'android'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      WDA_DERIVED_DATA: ${{ github.workspace }}/../wda
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/mobile/serve.sh
      - name: Record Xcode and the simulator runtimes
        run: |
          mkdir -p mobile-out
          { xcodebuild -version; xcrun simctl list runtimes; } | tee mobile-out/probes.txt
      - name: Install Appium and the XCUITest driver
        run: |
          npm i -g appium@3.9.0
          appium driver install xcuitest@12.22.7
      # Built here rather than inside the session request, which a ten-minute build outlives.
      - name: Build WebDriverAgent
        run: |
          project=$(find ~/.appium -name WebDriverAgent.xcodeproj -maxdepth 6 | head -1)
          xcodebuild build-for-testing -quiet -project "$project" -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$WDA_DERIVED_DATA" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
      - name: Start Appium
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          nohup appium --address 127.0.0.1 --port 4723 --keep-alive-timeout 1800 --log-timestamp > mobile-out/appium.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:4723/status > /dev/null && exit 0; sleep 1; done
          exit 1
      - run: node scripts/mobile/ios-run.mjs mobile-out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-run-${{ matrix.run }}
          path: |
            mobile-out/
            preview.log
