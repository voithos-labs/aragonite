name: Mobile input
# The editor under real phone input: an Android emulator (Chrome, Gboard) and the iOS Simulator
# (Mobile Safari, driven by Appium), typing and touching through the platform's own keyboard and
# touch screen. Each job runs the rows in `scripts/mobile/` and uploads its recordings. Android
# runs on a dev push that touches input code; iOS, on macOS runners that are few, runs nightly on
# dev (skipping a commit already green). Both run on pull requests to main.
on:
  push:
    branches: [dev]
    paths:
      - 'src/lib/selection/**'
      - 'src/lib/browser/**'
      - 'src/lib/caret/**'
      - 'src/lib/components/editor-root/**'
      - 'src/lib/components/blocks/text/**'
      - 'src/lib/components/blocks/editable/**'
      - 'src/lib/debug/input-recorder.ts'
      - 'src/routes/test/editor/**'
      - 'scripts/mobile/**'
      - '.github/workflows/mobile-input.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: The branch or commit to test
        default: dev
      platform:
        description: Which platform to run
        type: choice
        options: [both, android, ios]
        default: both

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions pinned to commit SHAs (a major tag is mutable); bump SHA and comment together.
jobs:
  android:
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.platform != 'ios')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/mobile/serve.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          enable-hw-keyboard: false
          script: bash scripts/mobile/android.sh mobile-out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: |
            mobile-out/
            preview.log

  # Which commit iOS tests and whether to. A scheduled run's own sha is main's, never the dev commit
  # it checks out, so the record of a green nightly is a cache entry keyed on the tested commit.
  ios-gate:
    if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.platform != 'android')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || inputs.ref || '' }}
      - id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: green
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mobile-ios-green
          key: mobile-ios-green-${{ steps.target.outputs.sha }}
          lookup-only: true
      - id: decide
        run: |
          run=${{ steps.green.outputs.cache-hit != 'true' }}
          echo "run=$run" >> "$GITHUB_OUTPUT"
          [ "$run" = true ] || echo "Skipped: this commit already ran green (${{ steps.target.outputs.sha }})." >> "$GITHUB_STEP_SUMMARY"

  ios:
    needs: ios-gate
    if: needs.ios-gate.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      WDA_DERIVED_DATA: ${{ github.workspace }}/../wda
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name != 'pull_request' && needs.ios-gate.outputs.sha || '' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/mobile/serve.sh
      - name: Record Xcode and the simulator runtimes
        run: |
          mkdir -p mobile-out
          { xcodebuild -version; xcrun simctl list runtimes; } | tee mobile-out/probes.txt
      - name: Install Appium and the XCUITest driver
        run: |
          npm i -g appium@3.9.0
          appium driver install xcuitest@12.22.7
      # Built here rather than inside the session request, which a ten-minute build outlives.
      - name: Build WebDriverAgent
        run: |
          project=$(find ~/.appium -name WebDriverAgent.xcodeproj -maxdepth 6 | head -1)
          xcodebuild build-for-testing -quiet -project "$project" -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$WDA_DERIVED_DATA" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
      - name: Start Appium
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          nohup appium --address 127.0.0.1 --port 4723 --keep-alive-timeout 1800 --log-timestamp > mobile-out/appium.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:4723/status > /dev/null && exit 0; sleep 1; done
          exit 1
      - run: node scripts/mobile/ios-run.mjs mobile-out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios
          path: |
            mobile-out/
            preview.log

  # The nightly passed: the next one skips this commit until dev moves.
  ios-record:
    needs: [ios-gate, ios]
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - run: mkdir .mobile-ios-green && echo "${{ needs.ios-gate.outputs.sha }}" > .mobile-ios-green/sha
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mobile-ios-green
          key: mobile-ios-green-${{ needs.ios-gate.outputs.sha }}
