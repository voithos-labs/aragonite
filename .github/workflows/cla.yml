name: CLA
# The bot lives in the repo rather than a hosted service: signatures are a JSON file on a branch
# of this repository, ours to read and keep. `pull_request_target` runs with the base repo's
# token and is safe here because the action never checks out the pull request's head.
on:
  pull_request_target:
    types: [opened, closed, synchronize]
  issue_comment:
    types: [created]

# The bot writes the signature file, comments on the pull request, and re-runs its own failed
# run once a comment signs.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

# Actions pinned to commit SHAs (a major tag is mutable); bump SHA and comment together.
jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # The guard sits on the step, not the job: `cla` is a required check, and a skipped job
      # reports none, so every pull_request_target event has to reach a verdict.
      - name: Check the CLA signature
        if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/voithos-labs/aragonite/blob/main/CLA.md'
          # A merged thread stays open; a signature is on record either way.
          lock-pullrequest-aftermerge: false
          path-to-signatures: 'signatures/cla.json'
          # Off `main` on purpose: the bot pushes each signature, and main's protection forbids it.
          branch: 'cla-signatures'
          allowlist: 'dependabot[bot],DanielZFLiu,finnrw'
