name: Plugin listing
# The plugin gallery's listing (docs/guide/plugin-gallery/listing.json). On a pull request that
# adds or changes an entry: check its shape, ask npm that the package carries the plugin keyword
# and names the entry's repository, then run the plugin check over the published package. On a
# manual run: check every entry against an editor release and open a pull request that records
# the results in the listing. The release cut runs `scripts/plugins/check-listing.mjs` itself.
#
# The plugin checks run third-party code, so they run with no permissions and no secrets, install
# with --ignore-scripts (inside plugin-check.yml), and nothing here uses pull_request_target. Only
# the last job writes, it runs none of a plugin's code, and it pushes a branch for its pull
# request, never `dev` or `main`.
on:
  pull_request:
    paths:
      - 'docs/guide/plugin-gallery/listing.json'
  workflow_dispatch:
    inputs:
      editor:
        description: The editor release to check every listed plugin against
        type: string
        default: latest

permissions: {}

# Actions pinned to commit SHAs (a major tag is mutable); bump SHA and comment together.
jobs:
  entries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.entries.outputs.packages }}
      editor: ${{ steps.entries.outputs.editor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - id: entries
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EDITOR: ${{ inputs.editor }}
        run: |
          node scripts/plugins/listing.mjs
          if [ -n "$BASE" ]; then
            echo "packages=$(node scripts/plugins/listing.mjs --changed-since "$BASE" | tail -n 1)" >> "$GITHUB_OUTPUT"
            echo "editor=" >> "$GITHUB_OUTPUT"
          else
            echo "packages=$(node -p 'JSON.stringify(require("./docs/guide/plugin-gallery/listing.json").map((e) => e.package))')" >> "$GITHUB_OUTPUT"
            echo "editor=$(npm view "@voithos-labs/aragonite@$EDITOR" version | tail -n 1)" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: entries
    if: needs.entries.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.entries.outputs.packages) }}
    uses: ./.github/workflows/plugin-check.yml
    # A cap, not a grant: the job that runs a plugin asks for none, and the packing job (which
    # these calls skip) asks to read the repository, which a nested job can't exceed.
    permissions:
      contents: read
    with:
      package: ${{ matrix.package }}@latest
      editor: ${{ needs.entries.outputs.editor != '' && format('@voithos-labs/aragonite@{0}', needs.entries.outputs.editor) || '' }}

  pull-request:
    needs: [entries, check]
    if: always() && github.event_name == 'workflow_dispatch' && needs.entries.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin-check-*
          path: results
      # Every result is checked against the record's shape before anything is written.
      - run: node scripts/plugins/check-listing.mjs --results results
      - env:
          GH_TOKEN: ${{ github.token }}
          EDITOR: ${{ needs.entries.outputs.editor }}
        run: |
          if git diff --quiet; then echo "nothing changed"; exit 0; fi
          branch="plugin-listing/$EDITOR"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "@ (plugins) the listing's checks on $EDITOR"
          git push origin "$branch"
          gh pr create --base dev --head "$branch" --title "@ (plugins) the listing's checks on $EDITOR" --body "The plugin check over every listed plugin, on editor $EDITOR."
