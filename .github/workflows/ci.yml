name: CI
on:
  push:
    branches: [main]
  pull_request:

# Three parallel jobs: the fast static+unit gate, the Playwright e2e battery, and
# the external-consumer realism gate (packs the library, installs the tarball into
# examples/consumer, and runs its SSR-no-crash + hydration smoke).
# e2e runs every project (blocks, selection, sticky-column, a11y, search, vr,
# simulation, perf-dev) via the dev webServer the playwright config starts.
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:editor

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  consumer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/consumer-smoke.mjs
