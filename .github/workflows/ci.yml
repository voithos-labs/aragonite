name: CI
on:
  push:
    branches: [main]
  pull_request:

# Two parallel jobs: the fast static+unit gate, and the Playwright e2e battery.
# e2e runs every project (blocks, selection, sticky-column, a11y, search, vr,
# simulation, perf-dev) via the dev webServer the playwright config starts.
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:editor

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
