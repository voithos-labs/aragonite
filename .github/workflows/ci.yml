name: CI
on:
  push:
    branches: [main]
  pull_request:

# Three parallel jobs: the fast static+unit gate, the Playwright e2e battery, and
# the external-consumer realism gate (packs the library, installs the tarball into
# examples/consumer, and runs its SSR-no-crash + hydration smoke).
# e2e runs every Playwright project via the dev webServer the playwright config
# starts (the e2e-perf specs self-skip unless PERF_GATE/PERF is set).
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:editor

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cache the browser download (~100MB per run); `playwright install` skips
      # re-downloading a cached build and still installs the OS deps.
      - run: echo "PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  consumer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/consumer-smoke.mjs
