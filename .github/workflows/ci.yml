name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Parallel jobs: the fast static+unit gate, the sharded Playwright e2e battery,
# the prod-build perf gate, and the external-consumer realism gate (packs the
# library, installs the tarball into examples/consumer, and runs its
# SSR-no-crash + hydration smoke).
# e2e shards run every Playwright project via the dev webServer the playwright
# config starts (the e2e-perf specs self-skip there unless PERF_GATE/PERF is
# set; the dedicated perf job is what runs them, against the prod build).
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:editor

  e2e:
    runs-on: ubuntu-latest
    strategy:
      # One red shard must not cancel the others — a full failure map per run
      # beats re-running to discover the next failure.
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cache the browser download (~100MB per run); `playwright install` skips
      # re-downloading a cached build and still installs the OS deps.
      - run: echo "PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}

  perf:
    runs-on: ubuntu-latest
    env:
      # Runners measured ~2.2x the calibration machine (runs 29177807039 /
      # 29178211384); 2.5 keeps this job a gross-regression net while the local
      # unscaled gate stays the tight one.
      PERF_RUNNER_SCALE: '2.5'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: echo "PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - run: npx playwright install --with-deps chromium
      # perf:check:prod builds and previews the app, then gates the keystroke rows
      # against that prod build (the e2e-perf-prod project) — a dev-server run would
      # measure vite transform overhead, not the editor. Gate rows only: the
      # attribution axes are diagnostic instruments with a recorded standing timeout
      # on 1MB fixtures (docs/issues.md) — they are not part of the regression gate.
      - run: npm run perf:check:prod -- --grep-invert attribution

  consumer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/consumer-smoke.mjs
