name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No job needs to write anything back through GITHUB_TOKEN; actions/cache
# authenticates to the cache service on its own, not through this scope.
permissions:
  contents: read

# Cancel superseded PR runs — three pushes to an open PR otherwise run three full
# matrices. Push runs (main) are NOT cancelled: main's pass/fail record per commit
# is the thing the branch is protected on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to commit SHAs with the version in a trailing
# comment: a major tag is mutable, so a repoint silently changes what every job
# runs. Bump the SHA and the comment together.
#
# Parallel jobs: the fast static+unit gate, the sharded Playwright e2e battery,
# the prod-build perf gate, the external-consumer realism gate (packs the
# library, installs the tarball into examples/consumer, and runs its
# SSR-no-crash + hydration smoke), and the emoji-table provenance gate.
# e2e shards run every Playwright project via the dev webServer the playwright
# config starts (the e2e-perf specs self-skip there unless PERF_GATE/PERF is
# set; the dedicated perf job is what runs them, against the prod build).
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The unit suite imports from examples/consumer, and vite resolves that file's tsconfig
      # chain into the example's GENERATED kit config — absent on a fresh checkout until the
      # example installs and syncs.
      - run: npm ci
        working-directory: examples/consumer
      - run: npx svelte-kit sync
        working-directory: examples/consumer
      - run: npm run lint
      - run: npm run check
      - run: npm run test:editor

  e2e:
    runs-on: ubuntu-latest
    strategy:
      # One red shard must not cancel the others — a full failure map per run
      # beats re-running to discover the next failure.
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Cache the browser download (~100MB per run); `playwright install` skips
      # re-downloading a cached build and still installs the OS deps.
      - run: echo "PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}

  perf:
    runs-on: ubuntu-latest
    env:
      # Runners measured ~2.2x the calibration machine (runs 29177807039 /
      # 29178211384); 2.5 keeps this job a gross-regression net while the local
      # unscaled gate stays the tight one.
      PERF_RUNNER_SCALE: '2.5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: echo "PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - run: npx playwright install --with-deps chromium
      # perf:check builds and previews the app, then gates the keystroke rows against
      # that prod build (the e2e-perf-prod project) — a dev-server run would measure vite
      # transform overhead, not the editor. The report-only rows exclude themselves via
      # their own PERF_GATE skip, so this needs no row filter.
      - run: npm run perf:check

  consumer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/consumer-smoke.mjs

  # The committed emoji table is a generated artifact no other gate reproduces, so
  # a hand-edit or half-finished regen would ship silently. Its own job: no `npm ci`
  # (the script imports node builtins only), and a drift reads as drift rather than
  # as a failure buried in the unit suite. The fetch is of a pinned commit, so this
  # is deterministic — a red here means the table changed, not that upstream did.
  emoji-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/verify-emoji-table.mjs
