name: Adapter suite
# Every framework app the shared adapter suite drives, including the per-release ones (Next, Nuxt,
# React 18, Vue 3.3) the per-PR `adapter-smoke` job in ci.yml leaves out. Runs on the release PR
# into main, and on demand.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions pinned to commit SHAs (a major tag is mutable); bump SHA and comment together.
jobs:
  adapter-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/smoke/adapter-smoke.mjs
