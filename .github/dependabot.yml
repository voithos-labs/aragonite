# GitHub reads this file from the default branch, so it takes effect once it lands on main.
# Version updates target dev; security updates (a repo setting) always target main.
# No `commit-message` block: dependabot's default `Bump ...` subject is one the commit linter exempts.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    target-branch: 'dev'
    open-pull-requests-limit: 5
    # Minor + patch bumps arrive as one grouped PR per dependency type;
    # majors fall outside the groups and arrive individually.
    groups:
      production-minor-patch:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
      development-minor-patch:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
    # jsdom 30.1 slows the deep-nesting unit tests from seconds to over a quarter hour; 30.0.1 is pinned.
    # typescript-eslint 8.72.1 can't resolve the root tsconfig's `$app/tsconfig` extends on Linux CI.
    ignore:
      - dependency-name: 'jsdom'
        versions: ['30.1.x']
      - dependency-name: 'typescript-eslint'
        versions: ['8.72.1']
      - dependency-name: '@typescript-eslint/*'
        versions: ['8.72.1']

  # The Vue 3.3 app tests the oldest Vue the adapter supports, so its Vue stays at 3.3.
  - package-ecosystem: 'npm'
    directory: '/examples/vue/vue-3.3'
    schedule:
      interval: 'monthly'
    target-branch: 'dev'
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: 'vue'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@vue/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  # The workflows pin third-party actions to commit SHAs with the version in
  # a trailing comment; dependabot bumps the SHA and the comment together.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    target-branch: 'dev'
    groups:
      actions:
        patterns: ['*']
