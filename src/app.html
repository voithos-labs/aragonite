<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<title>aragonite</title>
		<meta
			name="description"
			content="Lossless, efficient, and extensible Markdown block editor library for Svelte"
		/>
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://aragonite.dev/" />
		<meta property="og:title" content="aragonite" />
		<meta
			property="og:description"
			content="Lossless, efficient, and extensible Markdown block editor library for Svelte"
		/>
		<!-- Absolute by spec: a crawler resolves og:image with no page context. -->
		<meta property="og:image" content="https://aragonite.dev/og.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="An aragonite crystal cluster beside the word Aragonite"
		/>
		<meta name="twitter:card" content="summary_large_image" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
