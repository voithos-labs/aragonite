<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<title>aragonite</title>
		<meta
			name="description"
			content="A lossless, embeddable GFM Markdown block editor library for Svelte, round-tripping raw Markdown byte for byte. Live demo."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:title" content="aragonite" />
		<meta
			property="og:description"
			content="A lossless, embeddable GFM Markdown block editor library for Svelte, round-tripping raw Markdown byte for byte. Live demo."
		/>
		<!-- Absolute by spec: a crawler resolves og:image with no page context. -->
		<meta property="og:image" content="https://voithos-labs.github.io/aragonite/og.jpg" />
		<meta name="twitter:card" content="summary_large_image" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
