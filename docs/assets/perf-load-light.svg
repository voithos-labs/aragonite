<text x="24" y="34" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="start">Document load vs document size</text>
<text x="24" y="54" font-family="system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">materializing the tree is O(document): linear in block count</text>
