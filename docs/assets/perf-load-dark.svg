<svg xmlns="http://www.w3.org/2000/svg" width="880" height="412" viewBox="0 0 880 412" role="img" aria-label="Document load time across 9 fixture shapes from 100 kilobytes to 10 megabytes, on a log scale. Load grows roughly linearly with size; every shape loads within a few seconds at 10 megabytes, the 392 thousand block extreme taking the longest.">
<rect width="880" height="412" fill="#1a1a19"/>
