<svg xmlns="http://www.w3.org/2000/svg" width="880" height="412" viewBox="0 0 880 412" role="img" aria-label="Document load time across nine fixture shapes from 100 kilobytes to 10 megabytes, on a log scale. Load grows roughly linearly with size; every shape loads within a few seconds at 10 megabytes, the 392 thousand block extreme taking the longest.">
<rect width="880" height="412" fill="#1a1a19"/>
<text x="24" y="34" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="start">Document load vs document size</text>
<text x="24" y="54" font-family="system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">materializing the tree is O(document): linear in block count</text>
<circle cx="28" cy="73" r="4" fill="#3987e5"/>
<text x="37" y="77" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">8 other fixture shapes</text>
