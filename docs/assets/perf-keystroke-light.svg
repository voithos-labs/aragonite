<svg xmlns="http://www.w3.org/2000/svg" width="880" height="412" viewBox="0 0 880 412" role="img" aria-label="Keystroke p50 latency across nine fixture shapes from 100 kilobytes to 10 megabytes. Eight shapes stay in a flat band of a few milliseconds at every size. A single giant paragraph rises to above a second at 10 megabytes.">
<rect width="880" height="412" fill="#fcfcfb"/>
<text x="24" y="34" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="start">Keystroke latency (p50) vs document size</text>
<text x="24" y="54" font-family="system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">typing cost stays flat as the document grows, except inside one giant block</text>
<circle cx="28" cy="73" r="4" fill="#2a78d6"/>
<text x="37" y="77" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">8 other fixture shapes</text>
<circle cx="201.2" cy="73" r="4" fill="#eb6834"/>
<text x="210.2" y="77" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">single giant paragraph</text>
<line x1="64" y1="356" x2="620" y2="356" stroke="#e1e0d9" stroke-width="1"/>
<text x="56" y="360" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">1.0 ms</text>
<line x1="64" y1="281.225500937855" x2="620" y2="281.225500937855" stroke="#e1e0d9" stroke-width="1"/>
<text x="56" y="285.225500937855" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">10 ms</text>
<line x1="64" y1="206.45100187570992" x2="620" y2="206.45100187570992" stroke="#e1e0d9" stroke-width="1"/>
<text x="56" y="210.45100187570992" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">100 ms</text>
<line x1="64" y1="131.6765028135649" x2="620" y2="131.6765028135649" stroke="#e1e0d9" stroke-width="1"/>
<text x="56" y="135.6765028135649" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">1.0 s</text>
<line x1="64" y1="356" x2="620" y2="356" stroke="#c3c2b7" stroke-width="1"/>
<line x1="100" y1="356" x2="100" y2="361" stroke="#c3c2b7" stroke-width="1"/>
<text x="100" y="378" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">100 KB</text>
<line x1="342" y1="356" x2="342" y2="361" stroke="#c3c2b7" stroke-width="1"/>
<text x="342" y="378" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">1 MB</text>
<line x1="584" y1="356" x2="584" y2="361" stroke="#c3c2b7" stroke-width="1"/>
<text x="584" y="378" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">10 MB</text>
<text x="342" y="398" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="middle">document size (log-spaced) · vertical axis is log scale</text>
<polygon points="100,312.64697199852924 342,311.8034400962299 584,312.64697199852924 584,324.97057578134087 342,326.2442351947627 100,327.5698948632185" fill="#2a78d6" opacity="0.16"/>
<polyline points="100,322.5639822047706 342,323.14911789721936 584,320.32349718643513" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="100" cy="322.5639822047706" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="342" cy="323.14911789721936" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="584" cy="320.32349718643513" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<polyline points="100,273.4636297025866 342,206.77737801318187 584,126.43669278254362" fill="none" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/>
<circle cx="100" cy="273.4636297025866" r="4" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="100" y="261.4636297025866" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle" style="font-variant-numeric:tabular-nums">13 ms</text>
<circle cx="342" cy="206.77737801318187" r="4" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="342" y="194.77737801318187" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle" style="font-variant-numeric:tabular-nums">99 ms</text>
<circle cx="584" cy="126.43669278254362" r="4" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="584" y="114.43669278254362" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle" style="font-variant-numeric:tabular-nums">1.2 s</text>
<circle cx="636" cy="122.43669278254362" r="4" fill="#eb6834"/>
<text x="646" y="126.43669278254362" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">single giant paragraph</text>
<text x="646" y="142.43669278254362" font-family="system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">the whole file as one block,</text>
<text x="646" y="158.43669278254362" font-family="system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">the recorded exception</text>
<circle cx="636" cy="316.32349718643513" r="4" fill="#2a78d6"/>
<text x="646" y="320.32349718643513" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">8 other fixture shapes</text>
<text x="646" y="336.32349718643513" font-family="system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">band and median, 2.4 ms</text>
<text x="646" y="352.32349718643513" font-family="system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">to 3.9 ms at every size</text>
</svg>
