<svg xmlns="http://www.w3.org/2000/svg" width="880" height="412" viewBox="0 0 880 412" role="img" aria-label="Keystroke p50 latency across 9 fixture shapes from 100 kilobytes to 10 megabytes. 8 shapes stay in a flat band of a few milliseconds at every size. A single giant paragraph rises to above a second at 10 megabytes.">
<rect width="880" height="412" fill="#1a1a19"/>
<text x="24" y="34" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="start">Keystroke latency (p50) vs document size</text>
<text x="24" y="54" font-family="system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">typing cost stays flat as the document grows, except inside one giant block</text>
<circle cx="28" cy="73" r="4" fill="#3987e5"/>
<text x="37" y="77" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">8 other fixture shapes</text>
<circle cx="201.2" cy="73" r="4" fill="#d95926"/>
<text x="210.2" y="77" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">single giant paragraph</text>
<line x1="64" y1="356" x2="620" y2="356" stroke="#2c2c2a" stroke-width="1"/>
<text x="56" y="360" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">1.0 ms</text>
<line x1="64" y1="281.225500937855" x2="620" y2="281.225500937855" stroke="#2c2c2a" stroke-width="1"/>
<text x="56" y="285.225500937855" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">10 ms</text>
<line x1="64" y1="206.45100187570992" x2="620" y2="206.45100187570992" stroke="#2c2c2a" stroke-width="1"/>
<text x="56" y="210.45100187570992" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">100 ms</text>
<line x1="64" y1="131.6765028135649" x2="620" y2="131.6765028135649" stroke="#2c2c2a" stroke-width="1"/>
<text x="56" y="135.6765028135649" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">1.0 s</text>
<line x1="64" y1="356" x2="620" y2="356" stroke="#383835" stroke-width="1"/>
<line x1="100" y1="356" x2="100" y2="361" stroke="#383835" stroke-width="1"/>
<text x="100" y="378" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">100 KB</text>
<line x1="342" y1="356" x2="342" y2="361" stroke="#383835" stroke-width="1"/>
<text x="342" y="378" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">1 MB</text>
<line x1="584" y1="356" x2="584" y2="361" stroke="#383835" stroke-width="1"/>
<text x="584" y="378" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">10 MB</text>
<text x="342" y="398" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="middle">document size (log-spaced) · vertical axis is log scale</text>
<polygon points="100,319.2586754852152 342,321.42442133976675 584,322.5639822047706 584,327.5698948632185 342,327.5698948632185 100,328.95198226495074" fill="#3987e5" opacity="0.16"/>
<polyline points="100,326.9003009896656 342,325.60116165941696 584,325.60116165941696" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round"/>
<circle cx="100" cy="326.9003009896656" r="4" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="342" cy="325.60116165941696" r="4" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="584" cy="325.60116165941696" r="4" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<polyline points="100,275.03526634276824 342,206.51601521540198 584,126.13959554288735" fill="none" stroke="#d95926" stroke-width="2" stroke-linecap="round"/>
<circle cx="100" cy="275.03526634276824" r="4" fill="#d95926" stroke="#1a1a19" stroke-width="2"/>
<text x="100" y="263.03526634276824" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric:tabular-nums">12 ms</text>
<circle cx="342" cy="206.51601521540198" r="4" fill="#d95926" stroke="#1a1a19" stroke-width="2"/>
<text x="342" y="194.51601521540198" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric:tabular-nums">100 ms</text>
<circle cx="584" cy="126.13959554288735" r="4" fill="#d95926" stroke="#1a1a19" stroke-width="2"/>
<text x="584" y="114.13959554288735" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric:tabular-nums">1.2 s</text>
<circle cx="636" cy="122.13959554288735" r="4" fill="#d95926"/>
<text x="646" y="126.13959554288735" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">single giant paragraph</text>
<text x="646" y="142.13959554288735" font-family="system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">the whole file as one block,</text>
<text x="646" y="158.13959554288735" font-family="system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">the recorded exception</text>
<circle cx="636" cy="321.60116165941696" r="4" fill="#3987e5"/>
<text x="646" y="325.60116165941696" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">8 other fixture shapes</text>
<text x="646" y="341.60116165941696" font-family="system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">band and median, 2.3 ms</text>
<text x="646" y="357.60116165941696" font-family="system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">to 3.1 ms at every size</text>
</svg>
