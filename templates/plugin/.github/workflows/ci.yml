name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Swap to `npm ci` once you commit a package-lock.json.
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # The check a plugin listing runs: your packed package through the editor's conformance kits.
  # Pin it to the editor release you build against, the same version as your devDependency.
  conformance:
    uses: voithos-labs/aragonite/.github/workflows/plugin-check.yml@v0.11.4
